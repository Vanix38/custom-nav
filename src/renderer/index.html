<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self'; script-src 'self'" />
  <title>Custom Nav</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="chrome">
    <div id="tabbar">
      <div id="tabs" role="tablist"></div>
      <button id="new-tab" class="icon-btn" title="Nouvel onglet (Ctrl+T)">+</button>
      <span id="private-badge" hidden title="Rien n'est conservé à la fermeture de cette fenêtre : ni onglets, ni cookies, ni connexions">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 11c1.2-3 2.3-5 3.3-6 .4-.4 1-.5 1.5-.2l2.2 1.3h4l2.2-1.3c.5-.3 1.1-.2 1.5.2 1 1 2.1 3 3.3 6H3zm4 2a4 4 0 0 1 3.9 3.1 3 3 0 0 1 2.2 0A4 4 0 1 1 13 18a1 1 0 0 0-2 0 4 4 0 1 1-4-5zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
        Navigation privée
      </span>
    </div>
    <div id="toolbar">
      <button id="back" class="icon-btn" title="Précédent (Alt+←)">&#8592;</button>
      <button id="forward" class="icon-btn" title="Suivant (Alt+→)">&#8594;</button>
      <button id="reload" class="icon-btn" title="Recharger (F5)">&#8635;</button>
      <form id="address-form">
        <!-- Sélecteur moteurs / IA (rempli par renderer.js) -->
        <div id="engine-slot" role="toolbar" aria-label="Moteur de recherche ou IA"></div>
        <input id="address" type="text" spellcheck="false" autocomplete="off"
               placeholder="Rechercher ou saisir une adresse" />
      </form>
      <button id="private-window" class="icon-btn" title="Nouvelle fenêtre privée (Ctrl+Shift+N)">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 11c1.2-3 2.3-5 3.3-6 .4-.4 1-.5 1.5-.2l2.2 1.3h4l2.2-1.3c.5-.3 1.1-.2 1.5.2 1 1 2.1 3 3.3 6H3zm4 2a4 4 0 0 1 3.9 3.1 3 3 0 0 1 2.2 0A4 4 0 1 1 13 18a1 1 0 0 0-2 0 4 4 0 1 1-4-5zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
      </button>
      <button id="settings" class="icon-btn" title="Réglages (Ctrl+,)">&#9881;</button>
    </div>
  </header>
  <script src="renderer.js"></script>
</body>
</html>
