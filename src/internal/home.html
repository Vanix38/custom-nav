<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'" />
  <title>Nouvel onglet</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <main>
    <h1>Custom Nav</h1>
    <form id="search-form">
      <img id="active-icon" class="engine-icon" alt="" />
      <input id="q" type="search" autocomplete="off" spellcheck="false" autofocus />
    </form>
    <div id="engines" role="toolbar" aria-label="Moteur de recherche ou IA"></div>
    <p class="hint">Entrée : chercher · Clic : choisir le moteur · Shift+clic : nouvel onglet · Ctrl+1…9</p>
    <section id="favorites" aria-label="Favoris"></section>
  </main>
  <a id="settings-link" href="customnav://settings/" title="Réglages (Ctrl+,)">⚙ Réglages</a>
  <script src="home.js"></script>
</body>
</html>
